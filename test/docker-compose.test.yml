version: "3.9"
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_MOCK=true
      - OPENROUTER_API_KEY=test-key
    volumes:
      - test-data:/app/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  playwright:
    image: mcr.microsoft.com/playwright:v1.40.0-focal
    working_dir: /tests
    volumes:
      - ./:/tests
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL=http://app:8000
    command: npx playwright test

volumes:
  test-data:
